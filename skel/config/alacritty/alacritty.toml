# Minimal Alacritty config optimized for DWM + tmux + btop
# Truecolor + fast rendering for btop graphs and tmux status bar

[env]
# Let Alacritty use its own terminfo (best for truecolor in modern tmux)
TERM = "alacritty"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = false
decorations = "none"          # Clean look under DWM
opacity = 1.0
startup_mode = "Maximized"    # Or "Windowed" if you prefer

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }   # Change to your preferred font (e.g. "JetBrainsMono", "Hack", etc.)
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 12.0

# Optional: if you have a Nerd Font installed for better icons in btop/tmux
# normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }

[colors]
# Use your DWM colors here (replace with your actual palette)
# Example dark theme — edit these hex values to match your DWM config.h
[colors.primary]
background = "#1d1f21"
foreground = "#c5c8c6"

[colors.normal]
black   = "#282a2e"
red     = "#a54242"
green   = "#8c9440"
yellow  = "#de935f"
blue    = "#5f819d"
magenta = "#85678f"
cyan    = "#5e8d87"
white   = "#707880"

[colors.bright]
black   = "#373b41"
red     = "#cc6666"
green   = "#b5bd68"
yellow  = "#f0c674"
blue    = "#81a2be"
magenta = "#b294bb"
cyan    = "#8abeb7"
white   = "#c5c8c6"

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block" }

# Performance & btop/tmux friendly
[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
